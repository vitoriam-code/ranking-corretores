<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Corretores</title>
    <style>
        /* CSS: Tema Escuro e Design Responsivo */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --bar-bg: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px;}
        .controls {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: var(--card-bg);
            color: var(--text-color);
            width: 60%;
            font-size: 16px;
        }
        .last-update { font-size: 12px; color: #aaa; align-self: center; }
        
        .board { width: 100%; max-width: 800px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.02); }
        .rank { font-size: 24px; font-weight: bold; width: 50px; text-align: center; }
        .medal { font-size: 30px; }
        .info { flex-grow: 1; margin-left: 15px; }
        .name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .points { font-size: 16px; color: var(--accent-color); font-weight: bold; }
        
        /* Barra de Progresso */
        .progress-bar {
            width: 100%;
            background-color: var(--bar-bg);
            border-radius: 5px;
            height: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 5px;
            transition: width 1s ease-in-out;
        }

        /* Modo TV (Aumenta tudo se a tela for muito grande) */
        @media (min-width: 1600px) {
            body { padding: 50px; }
            .board, .controls { max-width: 1200px; }
            .card { padding: 25px 30px; }
            .name { font-size: 28px; }
            .points { font-size: 22px; }
            .rank { font-size: 36px; width: 80px;}
        }
    </style>
</head>
<body>

    <h1>🏆 Mural de Desempenho</h1>
    
    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍 Pesquisar corretor..." onkeyup="filterBoard()">
        <span class="last-update" id="lastUpdate">Atualizando...</span>
    </div>

    <div class="board" id="rankingBoard">
        <!-- Os cartões serão injetados aqui via JavaScript -->
    </div>

    <script>
        // COLOQUE O LINK DO SEU GOOGLE APPS SCRIPT AQUI
        const API_URL = "https://script.google.com/macros/s/AKfycbwX-Z8NJ7bMAcAMecOB3FeRaza9NWANM9f5GZDy68jE6iFIxLp6KJ2GHxkAIal6Ghgm/exec"; 
        
        let corretoresData = [];

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                corretoresData = data;
                renderBoard(data);
                
                const now = new Date();
                document.getElementById('lastUpdate').innerText = `Última atualização: ${now.toLocaleTimeString()}`;
            } catch (error) {
                console.error("Erro ao carregar os dados:", error);
                document.getElementById('rankingBoard').innerHTML = "<p>Erro ao carregar o ranking. Tentando novamente em breve...</p>";
            }
        }

        function renderBoard(data) {
            const board = document.getElementById('rankingBoard');
            board.innerHTML = ''; // Limpa o quadro
            
            if (data.length === 0) return;

            // Pega a maior pontuação para calcular a porcentagem da barra de progresso
            const maxPoints = data[0].Pontos > 0 ? data[0].Pontos : 1; 

            data.forEach((corretor, index) => {
                const rank = index + 1;
                let medal = rank;
                if (rank === 1) medal = '🥇';
                if (rank === 2) medal = '🥈';
                if (rank === 3) medal = '🥉';

                const percentage = (corretor.Pontos / maxPoints) * 100;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="rank">${medal}</div>
                    <div class="info">
                        <div class="name">${corretor.Corretor}</div>
                        <div class="points">${corretor.Pontos} pts</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
                board.appendChild(card);
            });
        }

        function filterBoard() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = corretoresData.filter(c => c.Corretor.toLowerCase().includes(query));
            renderBoard(filtered);
        }

        // Carrega ao abrir a página
        loadData();

        // Atualização automática a cada 5 minutos (300.000 ms)
        setInterval(loadData, 300000);
    </script>
</body>
</html>
