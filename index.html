<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Corretores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============ Tema: Preto & Dourado ============ */
        :root {
            --bg: #0a0b0f;
            --bg-soft: #10121a;
            --card: #14161f;
            --card-hi: #1a1d29;
            --line: rgba(255, 255, 255, 0.07);
            --text: #f3efe6;
            --muted: #9a9788;
            --gold: #d9b56d;
            --gold-hi: #f1d9a0;
            --gold-lo: #a9803a;
            --silver: #c9ced8;
            --bronze: #cf9566;

            --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--sans);
            color: var(--text);
            background:
                radial-gradient(900px 500px at 50% -150px, rgba(217, 181, 109, 0.14), transparent 70%),
                radial-gradient(700px 400px at 100% 100%, rgba(217, 181, 109, 0.05), transparent 70%),
                var(--bg);
            background-attachment: fixed;
            padding: 48px 20px 64px;
            -webkit-font-smoothing: antialiased;
        }

        .wrap { width: 100%; max-width: 860px; margin: 0 auto; }


        /* ============ Logo (centralizada, acima do título) ============ */
        .brand {
            text-align: center;
            line-height: 0;
            margin-bottom: 20px;
        }
        .brand img {
            display: inline-block;
            width: 92px;
            height: auto;
            opacity: .92;
            filter: drop-shadow(0 4px 14px rgba(217, 181, 109, 0.25));
        }

        /* ============ Cabeçalho ============ */
        header { text-align: center; margin-bottom: 36px; }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 500;
        }
        .eyebrow::before, .eyebrow::after {
            content: "";
            width: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }
        .eyebrow::after { transform: scaleX(-1); }
        h1 {
            font-family: var(--serif);
            font-weight: 600;
            font-size: clamp(38px, 7vw, 60px);
            line-height: 1.05;
            letter-spacing: 0.01em;
            margin: 14px 0 10px;
            background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .subtitle { color: var(--muted); font-size: 15px; margin: 0; }

        /* ============ Busca / atualização ============ */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }
        .search { position: relative; flex: 1; max-width: 420px; }
        .search svg {
            position: absolute; left: 16px; top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            stroke: var(--muted); fill: none; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
            pointer-events: none;
        }
        input[type="text"] {
            width: 100%;
            padding: 13px 18px 13px 44px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font: 500 15px var(--sans);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input[type="text"]::placeholder { color: var(--muted); }
        input[type="text"]:focus {
            border-color: rgba(217, 181, 109, 0.6);
            box-shadow: 0 0 0 4px rgba(217, 181, 109, 0.12);
        }
        .last-update {
            font-size: 12.5px;
            color: var(--muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .last-update::before {
            content: "";
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #5fcf8a;
            box-shadow: 0 0 0 4px rgba(95, 207, 138, 0.15);
        }

        /* ============ Pódio (Top 3) ============ */
        .podium {
            display: grid;
            grid-template-columns: 1fr 1.15fr 1fr;
            gap: 16px;
            align-items: end;
            margin-bottom: 28px;
        }
        .podium .p-card:nth-child(1) { order: 2; }  /* 1º no centro */
        .podium .p-card:nth-child(2) { order: 1; }
        .podium .p-card:nth-child(3) { order: 3; }

        .p-card {
            position: relative;
            text-align: center;
            padding: 30px 18px 24px;
            border-radius: 20px;
            background: linear-gradient(180deg, var(--card-hi), var(--card));
            border: 1px solid var(--line);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
        }
        .p-card.pos-1 {
            padding-top: 40px; padding-bottom: 32px;
            border-color: rgba(217, 181, 109, 0.5);
            background:
                radial-gradient(260px 160px at 50% 0, rgba(217, 181, 109, 0.18), transparent 70%),
                linear-gradient(180deg, var(--card-hi), var(--card));
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(217, 181, 109, 0.08), 0 0 60px rgba(217, 181, 109, 0.12);
        }
        .p-card.pos-2 { animation-delay: .08s; }
        .p-card.pos-3 { animation-delay: .16s; }

        .badge {
            width: 44px; height: 44px;
            margin: 0 auto 14px;
            border-radius: 50%;
            display: grid; place-items: center;
            font: 700 20px var(--serif);
            color: #1b1507;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        .pos-1 .badge { width: 56px; height: 56px; font-size: 26px; background: linear-gradient(145deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); }
        .pos-2 .badge { background: linear-gradient(145deg, #eef0f5, var(--silver) 55%, #8d93a0); }
        .pos-3 .badge { background: linear-gradient(145deg, #f0c9a2, var(--bronze) 55%, #98653a); }

        .crown { display: block; font-size: 22px; line-height: 1; margin-bottom: 8px; }

        .p-name {
            font-family: var(--serif);
            font-weight: 600;
            font-size: 24px;
            line-height: 1.15;
            margin-bottom: 10px;
            overflow-wrap: anywhere;
        }
        .pos-1 .p-name { font-size: 29px; }
        .p-points { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
        .p-points strong {
            display: block;
            font: 700 30px/1.1 var(--serif);
            letter-spacing: 0;
            text-transform: none;
            color: var(--gold-hi);
            margin-bottom: 2px;
        }
        .pos-2 .p-points strong { color: var(--silver); }
        .pos-3 .p-points strong { color: var(--bronze); }
        .pos-1 .p-points strong { font-size: 40px; }

        /* ============ Lista (4º em diante / resultados da busca) ============ */
        .board { display: flex; flex-direction: column; gap: 10px; }

        .row {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 22px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--line);
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
            animation: rise .5s ease both;
        }
        .row:hover {
            transform: translateY(-2px);
            border-color: rgba(217, 181, 109, 0.35);
            background: var(--card-hi);
        }
        .row.top { border-color: rgba(217, 181, 109, 0.28); }

        .r-pos {
            flex: 0 0 44px;
            text-align: center;
            font: 600 26px var(--serif);
            color: var(--muted);
        }
        .row.top .r-pos { color: var(--gold); }
        .row.top.p2 .r-pos { color: var(--silver); }
        .row.top.p3 .r-pos { color: var(--bronze); }

        .r-body { flex: 1; min-width: 0; }
        .r-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
        .r-name { font-size: 17px; font-weight: 600; letter-spacing: .005em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .r-points { font-size: 13px; color: var(--muted); white-space: nowrap; }
        .r-points strong { font: 700 22px var(--serif); color: var(--gold-hi); margin-right: 3px; }

        .progress-bar {
            height: 6px;
            margin-top: 11px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.07);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--gold-lo), var(--gold) 60%, var(--gold-hi));
            transition: width 1.1s cubic-bezier(.2, .8, .2, 1);
        }

        /* ============ Mensagens ============ */
        .message {
            text-align: center;
            color: var(--muted);
            padding: 48px 20px;
            border: 1px dashed var(--line);
            border-radius: 16px;
        }
        .skeleton { height: 72px; border-radius: 16px; background: linear-gradient(90deg, var(--card) 25%, var(--card-hi) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }

        footer { text-align: center; margin-top: 40px; font-size: 12px; letter-spacing: .08em; color: rgba(154, 151, 136, 0.7); }

        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes shimmer { to { background-position: -200% 0; } }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }

        /* ============ Celular ============ */
        @media (max-width: 640px) {
            body { padding: 32px 14px 48px; }
            .brand { margin-bottom: 16px; }
            .brand img { width: 78px; }
            .controls { flex-direction: column; align-items: stretch; gap: 12px; }
            .search { max-width: none; }
            .last-update { justify-content: center; }
            .podium { grid-template-columns: 1fr; gap: 12px; }
            .podium .p-card:nth-child(1) { order: 1; }
            .podium .p-card:nth-child(2) { order: 2; }
            .podium .p-card:nth-child(3) { order: 3; }
            .p-card, .p-card.pos-1 { padding: 22px 18px; }
            .row { padding: 14px 16px; gap: 12px; }
            .r-pos { flex-basis: 34px; font-size: 22px; }
            .r-name { font-size: 16px; }
        }

        /* ============ Modo TV ============ */
        @media (min-width: 1600px) {
            body { padding: 64px 60px; }
            .wrap { max-width: 1300px; }
            .brand { margin-bottom: 28px; }
            .brand img { width: 140px; }
            .eyebrow { font-size: 15px; }
            .subtitle { font-size: 19px; }
            input[type="text"] { font-size: 18px; padding: 16px 22px 16px 50px; }
            .last-update { font-size: 15px; }
            .p-card { padding: 40px 24px 32px; }
            .p-card.pos-1 { padding-top: 52px; padding-bottom: 42px; }
            .p-name { font-size: 32px; }
            .pos-1 .p-name { font-size: 40px; }
            .p-points strong { font-size: 42px; }
            .pos-1 .p-points strong { font-size: 56px; }
            .p-points { font-size: 16px; }
            .row { padding: 24px 32px; }
            .r-pos { font-size: 38px; flex-basis: 70px; }
            .r-name { font-size: 24px; }
            .r-points strong { font-size: 32px; }
            .r-points { font-size: 16px; }
            .progress-bar { height: 8px; }
        }
    </style>
</head>

        <header>
            <div class="eyebrow">Ranking de Corretores</div>
            <h1>Mural de Desempenho</h1>
            <p class="subtitle">Quem mais soma pontos, em tempo real</p>
        </header>

        <div class="controls">
            <label class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input type="text" id="searchInput" placeholder="Pesquisar corretor..." aria-label="Pesquisar corretor" oninput="filterBoard()">
            </label>
            <span class="last-update" id="lastUpdate">Atualizando...</span>
        </div>

        <div id="podium" class="podium"></div>
        <div class="board" id="rankingBoard">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>

        <footer>ATUALIZA AUTOMATICAMENTE A CADA 5 MINUTOS</footer>
    </div>

    <script>
        // COLOQUE O SEU LINK DO GOOGLE APPS SCRIPT AQUI DENTRO DAS ASPAS
        const API_URL = "https://script.google.com/macros/s/AKfycbwX-Z8NJ7bMAcAMecOB3FeRaza9NWANM9f5GZDy68jE6iFIxLp6KJ2GHxkAIal6Ghgm/exec";

        let corretoresData = [];
        let maxPointsGlobal = 1;

        // Evita que nomes com caracteres especiais quebrem o HTML
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
            ));
        }
        function fmt(n) { return Number(n).toLocaleString('pt-BR'); }

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                // Grava a posição real e define o maior ponto globalmente antes da pesquisa
                data.forEach((corretor, index) => { corretor.posicaoReal = index + 1; });

                corretoresData = data;

                if (data.length > 0) {
                    maxPointsGlobal = data[0].Pontos > 0 ? data[0].Pontos : 1;
                }

                filterBoard();

                const now = new Date();
                document.getElementById('lastUpdate').innerText = `Atualizado às ${now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
            } catch (error) {
                console.error("Erro ao carregar os dados:", error);
                document.getElementById('podium').innerHTML = '';
                document.getElementById('rankingBoard').innerHTML =
                    '<div class="message">Não foi possível carregar o ranking. Tentando novamente em breve...</div>';
            }
        }

        function podiumCard(c) {
            const crown = c.posicaoReal === 1 ? '<span class="crown">👑</span>' : '';
            return `
                <div class="p-card pos-${c.posicaoReal}">
                    ${crown}
                    <div class="badge">${c.posicaoReal}</div>
                    <div class="p-name">${esc(c.Corretor)}</div>
                    <div class="p-points"><strong>${fmt(c.Pontos)}</strong>pontos</div>
                </div>`;
        }

        function rowCard(c) {
            const percentage = Math.max(0, Math.min(100, (c.Pontos / maxPointsGlobal) * 100));
            const topClass = c.posicaoReal <= 3 ? ` top p${c.posicaoReal}` : '';
            return `
                <div class="row${topClass}">
                    <div class="r-pos">${c.posicaoReal}º</div>
                    <div class="r-body">
                        <div class="r-head">
                            <div class="r-name">${esc(c.Corretor)}</div>
                            <div class="r-points"><strong>${fmt(c.Pontos)}</strong>pts</div>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" data-width="${percentage}"></div></div>
                    </div>
                </div>`;
        }

        // searching = true: mostra tudo em lista (com a posição real de cada um)
        function renderBoard(data, searching) {
            const podium = document.getElementById('podium');
            const board = document.getElementById('rankingBoard');

            if (data.length === 0) {
                podium.innerHTML = '';
                board.innerHTML = searching
                    ? '<div class="message">Nenhum corretor encontrado.</div>'
                    : '<div class="message">Ainda não há corretores no ranking.</div>';
                return;
            }

            let listData = data;
            if (!searching) {
                podium.innerHTML = data.slice(0, 3).map(podiumCard).join('');
                listData = data.slice(3);
            } else {
                podium.innerHTML = '';
            }

            board.innerHTML = listData.map(rowCard).join('');

            // Anima as barras de progresso
            requestAnimationFrame(() => requestAnimationFrame(() => {
                board.querySelectorAll('.progress-fill').forEach(el => {
                    el.style.width = el.dataset.width + '%';
                });
            }));
        }

        function filterBoard() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderBoard(corretoresData, false);
                return;
            }
            const filtered = corretoresData.filter(c => String(c.Corretor).toLowerCase().includes(query));
            renderBoard(filtered, true);
        }

        // Carrega ao abrir a página e atualiza a cada 5 minutos
        loadData();
        setInterval(loadData, 300000);
    </script>
</body>
</html>
